[project]
name = "cnmv-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "httpx[http2]>=0.28.1",
    "lxml>=6.1.3",
    "typer>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
cnmv = "cnmv_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff.lint]
# Typer declares CLI options as function defaults by design.
ignore = ["B008"]
